# Pulls new and updated blog posts and events from the blog site's WordPress
# (blogs.chiragglobalhospitals.com) and commits them, so publishing there updates this site.
#
# Runs every 30 minutes, when started by hand (Actions → Sync blog & events → Run workflow),
# and instantly when the blog site sends a "cms-publish" repository_dispatch event.
# The commit to main triggers the host's normal deploy.
name: Sync blog & events

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cms-publish]

permissions:
  contents: write

concurrency:
  group: sync-cms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - run: npm ci

      - name: Sync from the blog site
        run: npm run cms:sync

      - name: Commit changes
        run: |
          git add src/data/blog-posts.json src/data/events.json public/blog public/events/cms
          if git diff --cached --quiet; then
            echo "No new or changed content."
            exit 0
          fi
          git config user.name "cms-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: sync blog posts and events from blog site"
          git push
